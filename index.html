<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talivexa AI Test</title>
  <style>
    body { background: #050b14; color: white; font-family: sans-serif; padding: 20px; }
    input { padding: 10px; width: 70%; background: #111; color: white; border: 1px solid #333; border-radius: 5px; }
    button { padding: 10px; background: #4a90e2; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #output { margin-top: 20px; padding: 10px; background: #111; border: 1px solid #333; border-radius: 5px; min-height: 100px; }
  </style>
</head>
<body>
  <h2>Talivexa AI - Test</h2>
  <div>
    <input type="text" id="chat-input" placeholder="Type here...">
    <button onclick="testSend()">Send</button>
  </div>
  <div id="output">Output will appear here...</div>

  <script>
    async function testSend() {
      const input = document.getElementById('chat-input').value;
      const output = document.getElementById('output');
      
      if (!input) {
        output.textContent = "Please type something first.";
        return;
      }

      output.textContent = "Sending to server...";

      try {
        // یہاں API کا راستہ ہے
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ prompt: input })
        });

        const data = await response.json();
        
        // اگر سرور سے جواب آیا تو یہاں دکھے گا
        output.textContent = "Server Response: " + JSON.stringify(data);

      } catch (error) {
        // اگر کوئی ایرر آیا تو یہاں دکھے گا
        output.textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
